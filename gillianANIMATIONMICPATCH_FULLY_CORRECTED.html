// Stage 1: Validate full top-level AI response structure
function validateAIResponse(obj){
  if(!obj||typeof obj!=='object'){_G.validate(1,false,'not an object');return{valid:false,reason:'Response is not an object'};}
  if(typeof obj.persona_speech!=='string'||!obj.persona_speech.trim()){_G.validate(1,false,'missing persona_speech');return{valid:false,reason:'Missing or empty persona_speech'};}
  if(obj.machine_actions!==undefined&&!Array.isArray(obj.machine_actions)){_G.validate(1,false,'machine_actions not array');return{valid:false,reason:'machine_actions must be an array'};}
  if(obj.state_updates!==undefined&&typeof obj.state_updates!=='object'){_G.validate(1,false,'state_updates not object');return{valid:false,reason:'state_updates must be an object'};}
  _G.validate(1,true,'');
  return{valid:true};
}

// Stage 2: Validate individual machine action against schema
function validateMachineAction(action){
  if(!action||typeof action!=='object'){_G.validate(2,false,'action not object');return{valid:false,reason:'Action not an object'};}
  const type=action.action_type;
  if(typeof type!=='string'||!type){_G.validate(2,false,'no action_type');return{valid:false,reason:'Missing action_type'};}
  const schema=ACTION_SCHEMAS[type];
  if(!schema){_G.validate(2,false,`unknown type: ${type}`);return{valid:false,reason:`Unknown action_type: ${type}`};}
  const p=action.payload||{};
  if(typeof p!=='object'||p===null){_G.validate(2,false,'payload not object');return{valid:false,reason:'Payload must be an object'};}
  // Check required keys
  for(const k of(schema.required||[])){
    if(p[k]===undefined||p[k]===null||p[k]===''){_G.validate(2,false,`missing required: ${k}`);return{valid:false,reason:`Missing required field: ${k} for ${type}`};}
  }
  // Check types
  for(const[k,expectedType]of Object.entries(schema.types||{})){
    if(p[k]!==undefined&&p[k]!==null){
      const actualType=typeof p[k];
      if(expectedType==='number'&&(actualType!=='number'||isNaN(p[k]))){
        // Attempt coercion
        const coerced=parseFloat(String(p[k]).replace(/[^0-9.-]/g,''));
        if(!isNaN(coerced))p[k]=coerced; else{_G.validate(2,false,`type: ${k} should be number`);return{valid:false,reason:`${k} must be a number for ${type}`};}
      }
      if(expectedType==='string'&&actualType!=='string')p[k]=String(p[k]);
    }
  }
  // Check enums
  for(const[k,allowed]of Object.entries(schema.enums||{})){
    if(p[k]!==undefined&&p[k]!==null&&!allowed.includes(p[k])){
      // Attempt case normalization
      const lower=String(p[k]).toLowerCase();
      if(allowed.map(a=>a.toLowerCase()).includes(lower))p[k]=lower;
      else{_G.validate(2,false,`enum: ${k}=${p[k]}`);return{valid:false,reason:`Invalid ${k}='${p[k]}' for ${type}. Allowed: ${allowed.join(',')}`};}
    }
  }
  // Reject unexpected extra keys (strict mode for action types that have defined schemas)
  // Allows extra keys only for open-schema types (NO_OP, PARK_CAR, CLEAR_PARKING)
  const openSchemaTypes=new Set([
    'NO_OP','PARK_CAR','CLEAR_PARKING','SCHEDULE_DEBRIEF',
    'UPDATE_PARKING_INTEL','LOG_ROUTINE',
    'LOG_AVOIDANCE','UPDATE_PROFILE_MEMORY','UPDATE_FINANCIAL_INTEL'
  ]);
  if(!openSchemaTypes.has(type)){
    const allowedKeys=new Set([...(schema.required||[]),...(schema.optional||[])]);
    const extraKeys=Object.keys(p).filter(k=>!allowedKeys.has(k));
    if(extraKeys.length>0){
      // Strip unknown keys rather than rejecting — model may append harmless extras
      extraKeys.forEach(k=>delete p[k]);
      _G.validate(2,true,`${type} stripped extra keys: ${extraKeys.join(',')}`);
    }
  }
  _G.validate(2,true,type);
  return{valid:true};
}

// REPAIR PASS: one constrained retry before fallback
async function _repairMalformedJSON(rawJson,msgs,sys){
  _G.repair(true);
  _anomalyCounters.repairAttempts++;
  const repairPrompt=`The previous response was not valid JSON. Return the same response as valid JSON only. Do not add commentary, markdown, or backticks. Output only a raw JSON object.\n\nPrevious response:\n${rawJson.slice(0,800)}\n\nReturn ONLY the JSON object:`;
  try{
    const raw=await callAI([...msgs,{role:'assistant',content:rawJson.slice(0,400)},{role:'user',content:repairPrompt}],sys);
    const clean=raw.replace(/```json\n?|```/gi,'').trim();
    const repExtracted=extractFirstJSONObject(clean);
    if(repExtracted){
      const repaired=JSON.parse(repExtracted);
      _anomalyCounters.repairSuccesses++;
      _G.repair(false);
      return repaired;
    }
  }catch(e){console.warn('[Repair] failed:',e.message);}
  _G.repair(false);
  return null;
}

async function processCognitiveState(rawJson,msgs,sys){
  if(!rawJson)return "I'm here.";
  let data={};
  let parseOK=false;

  // Attempt 1: clean and parse
  try{
    let clean=rawJson.replace(/```json\n?|```/gi,'').trim();
    const extracted=extractFirstJSONObject(clean);
    if(extracted){data=JSON.parse(extracted);parseOK=true;}
    else throw new Error('No JSON object found in response');
  }catch(e){
    console.warn('[Parse] initial parse failed:',e.message);
    // Attempt 2: ONE repair retry via provider
    if(msgs&&sys){
      const repaired=await _repairMalformedJSON(rawJson,msgs,sys);
      if(repaired){data=repaired;parseOK=true;console.log('[Parse] repair succeeded');}
    }
    if(!parseOK){
      // Fallback: extract persona_speech from broken output only
      let fb=rawJson.replace(/```json\n?|```/gi,'').trim();
      if(fb.includes('"persona_speech"')){
        let sp=fb.split('"persona_speech"')[1];
        if(sp){sp=sp.replace(/^[\s:"]+/,'').replace(/["}\s]*$/,'');data={persona_speech:sp.trim().slice(0,400)};parseOK=true;}
      }
      if(!parseOK){
        data={
          internal_reflection:null,
          state_updates:{},
          machine_actions:[],
          persona_speech:"Something went sideways. Try again."
        };
      }
    }
  }

  // Stage 1: validate top-level response structure
  const stage1=validateAIResponse(data);
  const responseStructurallyValid=stage1.valid;
  if(!responseStructurallyValid){
    console.warn('[Validate Stage1]',stage1.reason);
    _anomalyCounters.stage1Rejects++;
    _G.validate(1,false,stage1.reason);
    data.machine_actions=[];
    data.state_updates={};
    data.persona_speech=data.persona_speech||"Let me try that again.";
  }

  if(data.internal_reflection)_G.log('REFLECT',data.internal_reflection.slice(0,80));

  // State updates — gated behind valid top-level structure
  const su=data.state_updates||{};
  if(responseStructurallyValid){
    if(su.mood_inferred){memory.moodLog=memory.moodLog||[];memory.moodLog.push({mood:su.mood_inferred,ts:new Date().toISOString()});if(memory.moodLog.length>150)memory.moodLog=memory.moodLog.slice(-100);}
    // new_preference / new_challenge / new_harm_reduction: proposal queue, not direct write.
    // A proposed value must appear in at least 2 model turns before persisting.
    ['new_preference','new_challenge','new_harm_reduction'].forEach(key=>{
      const val=su[key];if(!val)return;
      const existing=_pendingProfileProposals.find(p=>p.key===key&&p.value===val);
      if(existing){
        existing.count++;
        if(existing.count>=2){
          // Confirmed — write to memory
          if(key==='new_preference'){const pp=val.split('|');if(pp.length>=2){memory.preferences=memory.preferences||{};memory.preferences[pp[0].trim().toLowerCase()]=pp[1].trim();}}
          else if(key==='new_challenge'){memory.psychProfile.challenges=memory.psychProfile.challenges||[];if(!memory.psychProfile.challenges.includes(val))memory.psychProfile.challenges.push(val);}
          else if(key==='new_harm_reduction'){memory.psychProfile.harm_reduction=memory.psychProfile.harm_reduction||[];if(!memory.psychProfile.harm_reduction.includes(val))memory.psychProfile.harm_reduction.push(val);}
          _pendingProfileProposals=_pendingProfileProposals.filter(p=>!(p.key===key&&p.value===val));
          _G.log('PROFILE_WRITE',key,'confirmed after repetition: '+val.slice(0,40));
        }
      }else{
        // First occurrence — queue it
        _pendingProfileProposals.push({key,value:val,count:1,ts:Date.now()});
        // Expire proposals older than 24 hours
        const cutoff=Date.now()-86400000;
        _pendingProfileProposals=_pendingProfileProposals.filter(p=>p.ts>cutoff);
      }
    });
    if(su.master_plan_update){memory.finances=memory.finances||{accounts:[],debts:[],bills:[],income:[],master_plan:'',financial_intel:''};memory.finances.master_plan=su.master_plan_update.trim();}
  }

  const actions=data.machine_actions||[];
  // REPAIR B: Normalize legacy one-key action shapes before validation
  // Converts {"ADD_TASK":{...}} → {action_type:"ADD_TASK", payload:{...}}
  for(let _ni=0;_ni<actions.length;_ni++){
    const _a=actions[_ni];
    if(_a&&typeof _a==='object'&&!_a.action_type){
      const _keys=Object.keys(_a);
      if(_keys.length===1&&ACTION_SCHEMAS[_keys[0]]){
        console.log('[ActionNorm] legacy one-key shape normalized:',_keys[0]);
        actions[_ni]={action_type:_keys[0],payload:typeof _a[_keys[0]]==='object'&&_a[_keys[0]]!==null?_a[_keys[0]]:{}};
      }
    }
  }
  let pendingConfirm=null;
  // REPAIR C/D: execution-truth tracking
  const _attempted=[];const _validated=[];const _executed=[];const _rejected=[];
  let _taskAttempted=false;let _taskExecuted=false;let _completeAttempted=false;let _completeExecuted=false;
  for(const act of actions){
    const type=act.action_type;
    // STEP 1: Normalize payload first (shim for legacy pipe-strings, passthrough for objects)
    // DEPRECATED SHIM — normalizes legacy pipe-delimited strings to objects for validation
    // TODO: remove once all prompt outputs produce structured objects exclusively
    const p=_parsePayload(type,act.payload||{});
    // STEP 2: Stage 2 validate the NORMALIZED payload (runs after shim normalization)
    const actForValidation={action_type:type,payload:p};
    const stage2=validateMachineAction(actForValidation);
    _attempted.push(type);
    if(type==='COMPLETE_TASK')_completeAttempted=true;
    if(!stage2.valid){
      const _rej={type,reason:'STAGE2: '+stage2.reason,raw:JSON.stringify(act).slice(0,200)};
      _rejected.push(_rej);
      console.warn('[TaskTelemetry] REJECTED stage2 —',type,'|',stage2.reason,'| raw:',JSON.stringify(act).slice(0,200));
      _G.action(type,'REJECTED: '+stage2.reason);
      continue;
    }
    // STEP 3: Write gate
    if(!_writeGate(_currentClassification,type)){
      _rejected.push({type,reason:'WRITE_GATE',raw:JSON.stringify(act).slice(0,200)});
      console.warn('[TaskTelemetry] WRITE_GATE_BLOCKED —',type);
      _G.action(type,'WRITE_GATE_BLOCKED');
      continue;
    }
    // STEP 4: Idempotency/dedupe check
    if(_checkDedupe(type,p)){
      _rejected.push({type,reason:'DEDUPED',raw:JSON.stringify(act).slice(0,200)});
      console.warn('[TaskTelemetry] DEDUPED —',type);
      _G.action(type,'DEDUPED');
      continue;
    }
    _validated.push(type);
    if(type==='ADD_TASK')_taskAttempted=true;
    _G.action(type,'EXECUTING');
    switch(type){
      case 'ADD_TASK':
        if(p.text){
          const exists=memory.tasks.some(t=>!t.done&&t.text.toLowerCase()===p.text.toLowerCase());
          if(!exists){
            const nt={
              id:genId(),
              text:p.text,
              done:false,
              priority:p.priority||'medium',
              created:new Date().toISOString(),
              deadline:null,
              blockedBy:null,
              updates:[],
              private:p.private===true||false,
              isNDIPriority:false,
              isReminder:false,
              source:'user',
              nagCount:0,
              lastNagTime:null,
              rolloverCount:0
            };
            if(p.deadline){
              const d=new Date(p.deadline);
              if(!isNaN(d.getTime()))nt.deadline=d.toISOString();
            }
            memory.tasks.push(nt);
            _taskExecuted=true;
            _executed.push('ADD_TASK');
            const _taskTime=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
            showToast(_taskTime+' — Task saved: '+p.text.slice(0,35),4000);
            _ndiShowTaskToggles(nt.id);
          }
        }
        break;
      case 'ADD_REMINDER':if(p.text&&p.dueAt){const exists=memory.tasks.some(t=>!t.done&&t.text.toLowerCase()===p.text.toLowerCase());if(!exists){const nd=new Date(p.dueAt);if(!isNaN(nd.getTime())){const nt={id:genId(),text:p.text,done:false,priority:'medium',created:new Date().toISOString(),deadline:nd.toISOString(),blockedBy:null,updates:[],private:false,isNDIPriority:false,isReminder:true,source:'reminder',nagCount:0,lastNagTime:null,rolloverCount:0};memory.tasks.push(nt);showToast('Reminder: '+p.text.slice(0,40),5000);_ndiShowTaskToggles(nt.id);}}}break;
      case 'UPDATE_TASK':if(p.match&&p.newText){const t=memory.tasks.find(t=>!t.done&&t.text.toLowerCase().includes(p.match.toLowerCase()));if(t){t.updates=t.updates||[];t.updates.push({old:t.text,ts:new Date().toISOString()});t.text=p.newText;}}break;
      case 'BLOCK_TASK':if(p.match){const t=memory.tasks.find(t=>!t.done&&t.text.toLowerCase().includes(p.match.toLowerCase()));if(t)t.blockedBy=p.blockedBy;}break;
      case 'PRIORITIZE_TASK':if(p.match){const t=memory.tasks.find(t=>!t.done&&t.text.toLowerCase().includes(p.match.toLowerCase()));if(t)t.priority=p.priority;}break;
      case 'SET_DEADLINE':if(p.match&&p.deadline){const t=memory.tasks.find(t=>!t.done&&t.text.toLowerCase().includes(p.match.toLowerCase()));if(t){const d=new Date(p.deadline);if(!isNaN(d.getTime()))t.deadline=d.toISOString();}}break;
      case 'COMPLETE_TASK':if(p.id){const t=memory.tasks.find(t=>t.id===String(p.id)&&!t.done);if(t){taskPendingConfirm=t;pendingConfirm=`Mark "${t.text}" as done?`;_completeExecuted=true;}}break;
      case 'DELETE_TASK':if(p.id){const _dtSid=String(p.id);const _dtIdx=memory.tasks.findIndex(t=>String(t.id)===_dtSid);if(_dtIdx!==-1){memory.tasks.splice(_dtIdx,1);if(_ndiPhraseHistory[_dtSid])delete _ndiPhraseHistory[_dtSid];showToast('Task deleted.');}}break;

      case 'ALARM':case 'SCHEDULE_ALARM':if(p.alarmAt)setAlarm(p.alarmAt,p.label||'Alarm',p.isWakeAlarm||false);break;

      case 'ADD_EVENT':case 'ADD_CALENDAR_EVENT':{const s=resolveCalendarStartAt(p.startAt,p.date,p.time);const res=commitCalendarEvent(p.title,s,p.durationMins||60,p.notes||'',{source:'ai'});if(res.ok){_executed.push(type);}else{_rejected.push({type,reason:'CALENDAR_'+res.reason,raw:JSON.stringify(act).slice(0,200)});console.warn('[CalendarTelemetry] ADD_CALENDAR_EVENT failed:',res.reason,p);}}break;
      case 'GCAL':case 'SYNC_TO_GCAL':if(p.title&&p.startAt)addToGoogleCalendar(p.title,p.startAt,p.durationMins||60);break;

    return _sanitizeOutput(_cFailSpeech);
  }
  const speech=_sanitizeOutput(pendingConfirm||data.persona_speech||'');
  return speech;
}

// ── HANDLE USER INPUT ─────────────────────────────────────────────
async function handleUserInput(text){
  text=typeof text==='string'?text:'';
  if(!text.trim()&&!pendingVisionTarget)return;if(_inputHandling)return;_inputHandling=true;
  try{
    const lower=text.toLowerCase();_currentClassification=text.trim()?runCognitivePipeline(text):null;
    if(taskPendingConfirm){
      if(lower.includes('confirm')||lower==='yes'||lower.includes('done')||lower.includes('do it')){const t=taskPendingConfirm;taskPendingConfirm=null;await completeTaskWithReward(t);return;}
      taskPendingConfirm=null;
    }
    lastInteractionTime=Date.now();dismissActiveAlarms();
    if(checkInsFired.wakeup&&!checkInsFired.briefingDelivered){if(wakeupNudgeTimer)clearTimeout(wakeupNudgeTimer);wakeupNudgeTimer=null;setTimeout(()=>triggerMorningBriefing(),500);}
    if(!pendingVisionTarget){let det=tryDeterministicCalendar(text);if(!det.handled)det=tryDeterministic(text);if(det.handled){_G.route('DETERMINISTIC',{input:text.slice(0,40),speech:det.speech.slice(0,40)});memory.conversations.push({role:'user',content:text,ts:new Date().toISOString()});memory.conversations.push({role:'assistant',content:det.speech,ts:new Date().toISOString()});if(memory.conversations.length>200)memory.conversations=memory.conversations.slice(-200);save();await speak(det.speech,'gillian');setOrbState('idle');return;}}
    _G.route('LLM',{domain:_currentClassification?.domain,salience:_currentClassification?.salience});
    setOrbState('thinking');TRM.transition(RS.AWAITING);
    // Stage user turn — committed only after a response or deliberate fallback (prevents dangling turns)
    const pendingUserTurn={role:'user',content:text||'[IMAGE SENT]',ts:new Date().toISOString()};
    try{
      let nearbyInj='';
      const ntriggers=['nearest ','closest ','nearby ','near me','find me a','where can i find','find a '];
      if(ntriggers.some(k=>lower.includes(k))&&currentLocation?.lat){
        try{const nt=ntriggers.find(k=>lower.includes(k));const sq=text.slice(lower.indexOf(nt)+nt.length).split(/[.?!]/)[0].trim();const res=await fetchNearby(sq,currentLocation.lat,currentLocation.lng);if(res.length>0)nearbyInj='\n[NEARBY: "'+sq+'"]: '+res.slice(0,5).map(r=>r.name+(r.address?' at '+r.address:'')+'('+r.dist+'m)').join('; ');}catch(e){}
      }
      const sys=buildSystemPrompt(_currentClassification?.domain)+nearbyInj;
      // Relevance-aware context selection — mirrors Tier 4 in buildSystemPrompt
      // Take recent turns + boost older turns that mention open task text
      const _allConvs=memory.conversations;
      const _openTxt=(memory.tasks||[]).filter(t=>!t.done).map(t=>t.text.toLowerCase().slice(0,20));
      function _cvScore(m){const txt=m.content.toLowerCase();let s=0;_openTxt.forEach(k=>{if(txt.includes(k))s+=3;});return s;}
      const _recent=_allConvs.slice(-Math.min(10,_BUDGET.recentConversations));
      const _older=_allConvs.slice(0,-10).filter(m=>_cvScore(m)>=3).slice(-6);
      // FIX 1: current user turn MUST be last message so Gillian sees it + vision attaches correctly
      const historyMsgs=[..._older,..._recent]
        .slice(-_BUDGET.recentConversations)
        .map(m=>({role:m.role,content:m.content.slice(0,500)}));
      // Normalize to strict user/assistant alternation starting with user (Gemini requirement)
      const rawMsgs=[...historyMsgs,{role:'user',content:text||'[IMAGE SENT]'}];
      const msgs=[];
      for(const m of rawMsgs){
        if(msgs.length===0){
          if(m.role==='assistant')continue; // drop leading assistant turns
          msgs.push({...m});
        }else{
          const last=msgs[msgs.length-1];
          if(last.role===m.role){last.content+='\n\n'+m.content;} // merge consecutive same-role
          else{msgs.push({...m});}
        }
      }
      const raw=await callAI(msgs,sys);clearVisionTarget();
      // FIX: pass msgs and sys so repair retry is active on main user-input path
      const clean=await processCognitiveState(raw,msgs,sys);
      // Commit user turn + assistant turn together atomically
      memory.conversations.push(pendingUserTurn);
      memory.conversations.push({role:'assistant',content:clean,ts:new Date().toISOString()});
      if(memory.conversations.length>200)memory.conversations=memory.conversations.slice(-200);
      save();
      TRM.transition(RS.RESPONDING,{text:clean});await speak(clean,'gillian');
    }catch(e){
      console.error('Gillian error:',e);
      _G.route('ERROR',{msg:e.message?.slice(0,80),failClass:e._failClass});
      let err='Something went wrong.';
      if(e.message==='ALL_PROVIDERS_EXHAUSTED')err='All AI engines at capacity. Give it a minute.';
      else if(e._failClass==='AUTH_FAILURE'||e.message?.includes('API key'))err='API key issue — check Settings.';
      else if(e._failClass==='RATE_CAPACITY'||e.message?.includes('capacity'))err='Capacity issue. Add a DeepSeek or Groq key in Profile for failover.';
      else if(e.message?.includes('timed out'))err='Request timed out. Check your connection.';
      else if(e.message)err=e.message.slice(0,100);
      // Commit both user turn and assistant error turn — symmetric history
      memory.conversations.push(pendingUserTurn);
      memory.conversations.push({role:'assistant',content:err,ts:new Date().toISOString()});
      if(memory.conversations.length>200)memory.conversations=memory.conversations.slice(-200);
      save();
      clearVisionTarget();showToast(err,6000);
      await speak(err.slice(0,80),'gillian');setOrbState('idle');
    }
  }finally{_inputHandling=false;_currentClassification=null;}
}

// ── NAG CADENCE — 3→2→2→2→1→30min (constitutional) ───────────────
const NAG_CADENCE_MINS=[3,3,3,3,2,2,2,1,1,1];
function getIntervalMins(count){return count<NAG_CADENCE_MINS.length?NAG_CADENCE_MINS[count]:30;}
function _ndiGetIntervalMins(task,count){if(task.isNDIPriority){const ps=[2,2,1,1,1];return count<ps.length?ps[count]:30;}return getIntervalMins(count);}
function getLatestAck(task){const kw=task.text.toLowerCase().slice(0,20);const msgs=memory.conversations.filter(c=>c.role==='user'&&c.content.toLowerCase().includes(kw));return msgs.length?msgs[msgs.length-1]:null;}
function clearTaskNagState(task){task.lastNagTime=null;task.nagCount=0;task.announcedDue=false;}

// ── TASK NAG LOOP ─────────────────────────────────────────────────
function startTaskNagLoop(){
  if(taskNagInterval)clearInterval(taskNagInterval);
  taskNagInterval=setInterval(async()=>{
    try{
      const now=new Date(),h=now.getHours(),nowMs=Date.now();
      const wt=(memory.settings?.wakeTime||'07:00').split(':').map(Number);
      const bt=getActiveBedtime().split(':').map(Number);
      if(h<wt[0]||h>=bt[0])return;if(orbState!=='idle')return;if(_speakBusy||speechSynthRunning)return;
      const idleSecs=(nowMs-lastInteractionTime)/1000;if(idleSecs<90)return;
      // Auto-expire heuristic removed: silently completing wrong tasks is unacceptable.
      const open=memory.tasks.filter(t=>!t.done);if(open.length===0)return;
      // Due announcements
      for(const t of open){if(t.deadline&&new Date(t.deadline)<=now&&!t.announcedDue){if(_nagFiring)return;_nagFiring=true;t.announcedDue=true;t.lastNagTime=nowMs;t.nagCount=0;save();await announceDueTask(t);_nagFiring=false;return;}}
      // Follow-up nags
      if(_mutationLock){_G.mic('NAGO_SKIP','lock held');return;}
      const cand=open.map(t=>{
        if(t.deadline&&new Date(t.deadline)>new Date(nowMs+2*60*60*1000))return{skip:true};
        let lastNag=t.lastNagTime||new Date(t.created).getTime();
        const ack=getLatestAck(t);if(ack&&new Date(ack.ts).getTime()>lastNag){t.lastNagTime=new Date(ack.ts).getTime();lastNag=t.lastNagTime;save();}
        const count=t.nagCount||0,reqMins=_ndiGetIntervalMins(t,count);
        return{t,secsSinceNag:(nowMs-lastNag)/1000,reqSecs:reqMins*60,count,skip:false};
      }).filter(({skip,secsSinceNag,reqSecs})=>!skip&&secsSinceNag>=reqSecs).sort((a,b)=>b.count-a.count||b.secsSinceNag-a.secsSinceNag)[0];
      if(cand){
        if(_nagFiring)return;
        await withMutationLock(async()=>{
          _nagFiring=true;
          const{t,count}=cand;t.lastNagTime=nowMs;t.nagCount=count+1;save();
          await fireTaskNag(t,t.nagCount);
          _nagFiring=false;
        });
      }
    }catch(e){console.error('Nag loop:',e);}finally{_nagFiring=false;}
  },60*1000);
}

async function announceDueTask(task){

  catch(e){setOrbState('idle');}
}

async function fireTaskNag(task,nagCount){
  _G.persist(nagCount,PrivacyBoundary.maskTask(task));
  if(_ndiResolvePrivacy(task)){
    try{playAlarmTone('notify');setOrbState('thinking');ndiCheckInterrupt(task);lastProactiveTime=Date.now();
      await speak(await ndiIntercept(task,'',nagCount),'gillian');setOrbState('idle');}
    catch(e){task.nagCount=Math.max(0,(task.nagCount||1)-1);task.lastNagTime=null;_nagFiring=false;save();setOrbState('idle');}
    return;
  }
  const ageMs=Date.now()-new Date(task.created).getTime();
  const ageDays=Math.floor(ageMs/86400000),ageHrs=Math.floor((ageMs%86400000)/3600000),ageMins=Math.floor((ageMs%3600000)/60000);
  const ageStr=ageDays>0?`${ageDays}d ${ageHrs}h`:ageHrs>0?`${ageHrs}h ${ageMins}m`:`${ageMins}m`;
  const avoided=(memory.avoidanceLog||[]).filter(a=>a.task===task.text).length;
  const rollNote=task.rolloverCount>0?` This has rolled over ${task.rolloverCount} time${task.rolloverCount>1?'s':''}.`:'';
  // Constitutional cadence stages — each stage has a distinct tone and escalation level
  const stages={

function executePruning(){
  if(!memory.pendingPrune)return;
  // Safe prune: always start from the first 'user' turn in the latter half
  // to prevent the pruned history starting with an assistant role (Gemini 400)
  const half=Math.floor(memory.conversations.length/2);
  let safeStart=half;
  while(safeStart<memory.conversations.length&&memory.conversations[safeStart].role!=='user') safeStart++;
  if(safeStart>=memory.conversations.length) safeStart=half; // fallback: no user turn found, keep original half
  memory.conversations=memory.conversations.slice(safeStart);
  memory.pendingPrune=null;
  document.getElementById('pill-profile').classList.remove('alert-orange');
  setOrbState('idle');save();
  showToast('Memory pruned — log preserved, context trimmed.',5000);
}

function setAlarm(timeStr,label,isWakeAlarm=false){
  const now=new Date(),parts=timeStr.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/i);
  let h,m;
  if(parts){h=parseInt(parts[1]);m=parseInt(parts[2]);const ap=(parts[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;else if(ap==='am'&&h===12)h=0;}
  else{const d=new Date(timeStr);if(!isNaN(d.getTime())){h=d.getHours();m=d.getMinutes();}else{showToast('⚠ Invalid alarm time: '+timeStr);return;}}
  let target=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0);
  if(target<=now)target.setDate(target.getDate()+1);
  const id=genId();
  const ms=target.getTime()-now.getTime();
  scheduledAlarms.push({id,label,alarmAt:target.toISOString(),isWakeAlarm,rehydratedOverdueAt:null});
  _alarmTimers[id]=setTimeout(()=>fireAlarm(id,label,isWakeAlarm),ms);
  save();
  showToast(`⏰ ${label} set for ${target.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}`,5000);
}
async function fireAlarm(id,label,isWakeAlarm){
  delete _alarmTimers[id];
  scheduledAlarms=scheduledAlarms.filter(a=>String(a.id)!==String(id));save();
  _activeAlarms.push({id,label,ts:Date.now()});
  playAlarmTone('alarm');
  const speech=isWakeAlarm?`Wake up. ${label}.`:`Alarm: ${label}.`;
  await speak(speech,'gillian');
  updateDashboard();
  // Re-speak once after 30s if still unacknowledged (user hasn't interacted)
  setTimeout(async()=>{
    if(_activeAlarms.some(a=>a.id===id)){
      playAlarmTone('alarm');
      await speak(speech,'gillian');
    }
  },30000);
}
function rehydrateAlarms(){
  const now=Date.now();
  let mutated=false;
  scheduledAlarms=(scheduledAlarms||[]).filter(a=>a&&a.id&&a.alarmAt);
  scheduledAlarms.forEach(a=>{
    const id=String(a.id);
    a.id=id;
    if(_alarmTimers[id])return;
    const targetMs=new Date(a.alarmAt).getTime();
    if(!Number.isFinite(targetMs))return;
    // Future alarm: re-arm normally
    if(targetMs>now){
      _alarmTimers[id]=setTimeout(()=>fireAlarm(id,a.label,a.isWakeAlarm),targetMs-now);
      return;
    }
    // Overdue alarm: fire only once across boots via persisted marker
    if(a.rehydratedOverdueAt)return;
    a.rehydratedOverdueAt=new Date().toISOString();
    mutated=true;
    _alarmTimers[id]=setTimeout(()=>fireAlarm(id,a.label,a.isWakeAlarm),1000);
  });
  if(mutated)save();
}
function dismissActiveAlarms(){if(_activeAlarms.length>0){_activeAlarms=[];updateDashboard();}}

// ── RECURRING EVENTS ──────────────────────────────────────────────
function generateRecurringEvents(){
  if(!memory.recurring?.length)return;
  const now=new Date();const ahead=new Date(now.getTime()+14*24*60*60*1000);
  memory.recurring.filter(r=>r.active!==false).forEach(r=>{
    const genThru=r.generatedThrough?new Date(r.generatedThrough):now;
    if(genThru>=ahead)return;
    const [rh,rm]=r.time.split(':').map(Number);
    let cursor=new Date(Math.max(now.getTime(),genThru.getTime()));cursor.setHours(rh,rm,0,0);
    while(cursor<=ahead){
      const dow=cursor.getDay();let match=false;
      if(r.recurrence==='daily')match=true;
      else if(r.recurrence==='weekdays')match=dow>=1&&dow<=5;
      else if(r.recurrence==='weekends')match=dow===0||dow===6;
      else if(r.recurrence?.startsWith('weekly:')){const d=parseInt(r.recurrence.split(':')[1]);match=dow===d;}
      else if(r.recurrence?.startsWith('monthly:')){const day=parseInt(r.recurrence.split(':')[1]);match=cursor.getDate()===day;}
      if(match&&cursor>now){
        const key=`${r.id}_${toDateStr(cursor)}`;
        const exists=(memory.events||[]).some(e=>
          e.recurringKey===key||
          (e.recurringId===r.id&&e.start===cursor.toISOString()&&e.title===r.title)
        );
        if(!exists){memory.events.push({id:genId(),title:r.title,start:cursor.toISOString(),end:new Date(cursor.getTime()+(r.durationMins||30)*60000).toISOString(),notes:r.notes||'',recurringId:r.id,recurringKey:key});}
      }
      cursor.setDate(cursor.getDate()+1);
    }
    r.generatedThrough=ahead.toISOString();
  });
  save();
}

async function fetchNearby(placeType,lat,lng,radiusM=1000){
  const typeMap={coffee:'amenity=cafe',pharmacy:'amenity=pharmacy',hospital:'amenity=hospital',gas:'amenity=fuel','gas station':'amenity=fuel',atm:'amenity=atm',bank:'amenity=bank',grocery:'shop=supermarket',supermarket:'shop=supermarket',gym:'leisure=fitness_centre',park:'leisure=park',restaurant:'amenity=restaurant',pizza:'cuisine=pizza',parking:'amenity=parking_space'};
  const query=typeMap[placeType.toLowerCase()]||`name~"${placeType}",i`;
  const overpassQuery=`[out:json][timeout:15];node[${query}](around:${radiusM},${lat},${lng});out body 10;`;
  try{
    const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:overpassQuery,signal:AbortSignal.timeout(15000)});
    if(!res.ok)throw new Error('Overpass failed');
    const data=await res.json();
    return(data.elements||[]).map(el=>{
      const dist=Math.round(coordDist(lat,lng,el.lat,el.lon)*1000);

    }).filter(r=>r.name).sort((a,b)=>a.dist-b.dist);
  }catch(e){console.warn('Overpass:',e);return[];}
}

// ── SERVICE WORKER ────────────────────────────────────────────────
function initServiceWorker(){
  if(!('serviceWorker'in navigator))return;
  // SW requires same-origin script; blob: URL is scoped to null origin.
  // Only attempt registration when served from http/https.
  if(window.location.protocol==='file:'){console.log('[SW] skipped (file: protocol)');return;}
  const swCode=`const CACHE='gillian-v1';const PRECACHE=['/'];self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(cache=>cache.addAll(PRECACHE).catch(()=>{})).then(()=>self.skipWaiting()));});self.addEventListener('activate',e=>e.waitUntil(clients.claim()));self.addEventListener('fetch',e=>{if(!e.request.url.startsWith('http'))return;e.respondWith(caches.match(e.request).then(cached=>cached||fetch(e.request).then(res=>{if(res.ok){const c=res.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));}return res;}).catch(()=>caches.match('/')||new Response('offline',{status:503}))));});`;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const url=URL.createObjectURL(blob);
  navigator.serviceWorker.register(url,{scope:'/'}).then(()=>console.log('[SW] registered')).catch(e=>console.warn('[SW] registration failed (needs http/https):',e.message));
}

// ── CALENDAR SAVE REPAIR ─────────────────────────────────────────
// Guarantees calendar writes have a real events array, a valid local start time,
// and a visible success/failure result. Used by manual form, AI actions, and
// deterministic voice/chat calendar commands.
function ensureCalendarEventsArray(){
  if(!Array.isArray(memory.events))memory.events=[];
  return memory.events;
}
function parseLocalDateTime(dateStr,timeStr){
  if(!dateStr)return null;
  const t=(timeStr&&/^\d{1,2}:\d{2}$/.test(timeStr))?timeStr:'00:00';
  const d=new Date(`${dateStr}T${t}:00`);
  return isNaN(d.getTime())?null:d;
}
function resolveCalendarStartAt(startAt,date,time){
  if(date){
    const d=parseLocalDateTime(date,time);
    if(d)return d;
  }
  if(startAt instanceof Date&&!isNaN(startAt.getTime()))return startAt;
  if(typeof startAt==='string'&&startAt.trim()){
    const raw=startAt.trim();
    const direct=new Date(raw);
    if(!isNaN(direct.getTime()))return direct;
    const m=raw.match(/^(\d{4}-\d{2}-\d{2})(?:[ T](\d{1,2}:\d{2}))?$/);
    if(m)return parseLocalDateTime(m[1],m[2]||time||'00:00');
  }
  return null;
}
function commitCalendarEvent(title,start,durationMins,notes,extra){
  ensureCalendarEventsArray();
  const safeTitle=String(title||'').trim();
  if(!safeTitle)return{ok:false,reason:'missing-title'};
  if(!(start instanceof Date)||isNaN(start.getTime()))return{ok:false,reason:'invalid-date'};
  const dur=Math.max(5,Math.min(parseInt(durationMins,10)||60,1440));
  const end=new Date(start.getTime()+dur*60000);
  const evt={id:genId(),title:safeTitle,start:start.toISOString(),end:end.toISOString(),notes:String(notes||'')};
  if(extra&&typeof extra==='object')Object.assign(evt,extra);
  memory.events.push(evt);
  save();
  if(document.getElementById('cal-panel')?.classList.contains('open'))renderCalendar(calSelectedDate);
  const _dpOvl=document.getElementById('day-planner-overlay');
  if(_dpOvl&&!_dpOvl.classList.contains('hidden'))renderDayPlanner();
  showToast('📅 '+safeTitle,4000);
  return{ok:true,event:evt};
}
function tryDeterministicCalendar(text){
  const raw=String(text||'').trim();
  const l=raw.toLowerCase();
  if(!/\b(add|put|schedule|book|create|make)\b/.test(l)||!/\b(calendar|event|appointment|meeting)\b/.test(l))return{handled:false};
  const now=new Date();
  let date=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(/\btomorrow\b/.test(l))date.setDate(date.getDate()+1);
  else{
    const iso=l.match(/\b(\d{4}-\d{2}-\d{2})\b/);
    const slash=l.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
    const weekdays=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
    const wd=weekdays.findIndex(d=>new RegExp(`\\b(next\\s+)?${d}\\b`).test(l));
    if(iso){
      const d=new Date(iso[1]+'T00:00:00');
      if(!isNaN(d.getTime()))date=d;
    }else if(slash){
      const y=slash[3]?Number(slash[3].length===2?'20'+slash[3]:slash[3]):now.getFullYear();
      const d=new Date(y,Number(slash[1])-1,Number(slash[2]));
      if(!isNaN(d.getTime()))date=d;
    }else if(wd>=0){
      let diff=(wd-date.getDay()+7)%7;
      if(diff===0||/\bnext\s+/.test(l))diff+=7;
      date.setDate(date.getDate()+diff);
    }
  }
  const tm=l.match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)||l.match(/\b(?:at\s*)?([01]?\d|2[0-3]):([0-5]\d)\b/);
  if(!tm)return{handled:false};
  let h=Number(tm[1]),mi=Number(tm[2]||0);
  if(tm[3]==='pm'&&h<12)h+=12;
  if(tm[3]==='am'&&h===12)h=0;
  date.setHours(h,mi,0,0);
  let title=raw
    .replace(/\b(add|put|schedule|book|create|make)\b/ig,' ')
    .replace(/\b(to|on|in|my|the)?\s*calendar\b/ig,' ')
    .replace(/\b(event|appointment|meeting)\b/ig,' ')
    .replace(/\btoday\b|\btomorrow\b/ig,' ')
    .replace(/\bnext\s+(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,' ')
    .replace(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/ig,' ')
    .replace(/\b\d{4}-\d{2}-\d{2}\b/g,' ')
    .replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g,' ')
    .replace(/\b(?:at\s*)?\d{1,2}(?::\d{2})?\s*(am|pm)\b/ig,' ')
    .replace(/\b(?:at\s*)?([01]?\d|2[0-3]):([0-5]\d)\b/ig,' ')
    .replace(/\s+/g,' ').trim();
  title=title.replace(/^(called|named|titled|for|about)\s+/i,'').trim()||'Calendar event';
  const res=commitCalendarEvent(title,date,60,'',{source:'deterministic'});
  return{handled:res.ok,speech:res.ok?`Added "${title}" to the calendar.`:`I could not add that calendar event because the ${res.reason==='invalid-date'?'date or time':'title'} was not usable.`};
}

// ── CALENDAR UI ───────────────────────────────────────────────────
function renderCalendar(selectedDate=null){
  const el=document.getElementById('cal-content');if(!el)return;
  const now=new Date();const y=calViewYear,mo=calViewMonth;
  const first=new Date(y,mo,1),last=new Date(y,mo+1,0);
  const startDow=first.getDay(),days=last.getDate();
  const mName=new Date(y,mo,1).toLocaleDateString('en-US',{month:'long',year:'numeric'}).toUpperCase();
  let html=`<div id="cal-nav"><button class="cal-nav-btn" onclick="calNav(-1)" type="button">‹</button><span id="cal-month-label">${mName}</span><button class="cal-nav-btn" onclick="calNav(1)" type="button">›</button></div>`;
  html+=`<div class="cal-grid">`;
  ['S','M','T','W','T','F','S'].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++){const d=new Date(y,mo,1-startDow+i);html+=`<div class="cal-day other-month" onclick="calSelectDate('${toDateStr(d)}')"><span class="cal-day-num">${d.getDate()}</span></div>`;}
  for(let d=1;d<=days;d++){
    const date=new Date(y,mo,d);const ds=toDateStr(date);const isToday=ds===toDateStr(now);const isSel=selectedDate&&ds===selectedDate;
    const hasEvts=(memory.events||[]).some(e=>e.start.startsWith(ds));
    html+=`<div class="cal-day${isToday?' today':''}${isSel?' selected':''}${hasEvts?' has-events':''}" onclick="calSelectDate('${ds}')"><span class="cal-day-num">${d}</span></div>`;
  }
  html+=`</div>`;
  const dispDate=selectedDate||toDateStr(now);
  const dayEvts=(memory.events||[]).filter(e=>e.start.startsWith(dispDate)).sort((a,b)=>new Date(a.start)-new Date(b.start));
  html+=`<div class="cal-events-section"><div class="cal-events-title">${new Date(dispDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()} — ${dayEvts.length} EVENT${dayEvts.length!==1?'S':''}</div>`;
  if(dayEvts.length>0){dayEvts.forEach(e=>{html+=`<div class="cal-event-item"><div class="cal-event-time">${new Date(e.start).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</div><div style="flex:1"><div class="cal-event-title">${esc(e.title)}</div>${e.notes?`<div class="cal-event-notes">${esc(e.notes)}</div>`:''}</div><button class="cal-event-delete" onclick="deleteCalEvent('${e.id}')" type="button">×</button></div>`;});}
  else html+=`<div style="text-align:center;padding:24px;font-family:var(--font-mono);font-size:11px;color:rgba(165,180,252,0.75)">CLEAR DAY — tap + ADD or tell Gillian to schedule something</div>`;
  html+=`<button onclick="openDayPlanner('${dispDate}')" style="width:100%;margin-top:16px;padding:12px;background:rgba(67,56,202,0.15);border:1px solid rgba(129,140,248,0.2);border-radius:8px;color:var(--indigo-bright);font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;cursor:pointer" type="button">DAY PLANNER VIEW</button>`;
  html+=`</div>`;el.innerHTML=html;
}
function calNav(dir){calViewMonth+=dir;if(calViewMonth<0){calViewMonth=11;calViewYear--;}else if(calViewMonth>11){calViewMonth=0;calViewYear++;}renderCalendar(calSelectedDate);}
function calSelectDate(ds){calSelectedDate=ds;renderCalendar(ds);}
function deleteCalEvent(id){const _eid=String(id);memory.events=(memory.events||[]).filter(e=>String(e.id)!==_eid);save();if(document.getElementById('day-planner-overlay')&&!document.getElementById('day-planner-overlay').classList.contains('hidden'))renderDayPlanner();else renderCalendar(calSelectedDate);}
function showAddEventForm(prefillDate=null){const f=document.getElementById('add-event-form');f.classList.add('open');const today=prefillDate||toDateStr(new Date());document.getElementById('aef-date').value=today;document.getElementById('aef-time').value='09:00';}
function hideAddEventForm(){document.getElementById('add-event-form').classList.remove('open');}
function saveEventForm(){
  const title=document.getElementById('aef-title').value.trim(),date=document.getElementById('aef-date').value,time=document.getElementById('aef-time').value,dur=parseInt(document.getElementById('aef-dur').value)||60,notes=document.getElementById('aef-notes').value.trim();
  if(!title||!date){showToast('Title and date required.');return;}
  const start=resolveCalendarStartAt(null,date,time);
  const res=commitCalendarEvent(title,start,dur,notes,{source:'manual'});
  if(!res.ok){showToast(res.reason==='invalid-date'?'Invalid date/time.':'Title and date required.');return;}
  hideAddEventForm();
  document.getElementById('aef-title').value='';document.getElementById('aef-notes').value='';
}

// ── DAY PLANNER ───────────────────────────────────────────────────
function openDayPlanner(ds){_dpDate=ds||toDateStr(new Date());const overlay=document.getElementById('day-planner-overlay');if(!overlay)return;overlay.classList.remove('hidden');renderDayPlanner();}
function closeDayPlanner(){const overlay=document.getElementById('day-planner-overlay');if(overlay)overlay.classList.add('hidden');}
function dayPlannerAddEvent(){if(_dpDate)showAddEventForm(_dpDate);}
function renderDayPlanner(){
  const el=document.getElementById('day-planner-body'),lbl=document.getElementById('day-planner-date-label');if(!el||!lbl||!_dpDate)return;
  lbl.textContent=new Date(_dpDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();
  const evts=(memory.events||[]).filter(e=>e.start.startsWith(_dpDate));let html='';
  for(let h=0;h<=23;h++){
    const hStr=String(h).padStart(2,'0')+':00';const label=new Date(2000,0,1,h).toLocaleTimeString('en-US',{hour:'numeric',hour12:true}).replace(' ','');
    const hourEvts=evts.filter(e=>{const eh=new Date(e.start).getHours();return eh===h;});
    html+=`<div class="dp-hour-slot" onclick="showAddEventForm('${_dpDate}')"><div class="dp-hour-label">${label}</div><div class="dp-hour-events">`;
    if(hourEvts.length>0)hourEvts.forEach(e=>{html+=`<div class="dp-event-chip">${esc(e.title)}<span class="dp-del" onclick="event.stopPropagation();deleteCalEvent('${e.id}');renderDayPlanner()">×</span></div>`;});
    else html+=`<div class="dp-empty-hint">—</div>`;
    html+=`</div></div>`;
  }
  el.innerHTML=html;
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportBrain(){
  const type=confirm('FULL PRIVATE BACKUP — includes all journal content and private tasks.\n\nOK = Full backup (private)\nCancel = Standard export (journal excluded, private tasks masked)')?'full':'standard';
  const raw={config,memory,scheduledAlarms};const masked=PrivacyBoundary.maskForExport(raw,type==='full');
  const blob=new Blob([JSON.stringify({...masked,exportType:type,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`gillian_${type==='full'?'backup':'export'}_${toDateStr(new Date())}.json`;a.click();URL.revokeObjectURL(url);showToast(`Brain ${type} exported.`);
}
function confirmWipe(){if(confirm('WIPE ALL DATA? This cannot be undone.')){localStorage.removeItem(DB_KEY);localStorage.removeItem(DB_KEY_LEGACY);location.reload();}}

function initGcalOAuth(){showToast('Connect Google Calendar in Settings → Google Calendar OAuth.',6000);}
